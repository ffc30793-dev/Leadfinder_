<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — LeadFinder</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="auth-page">
  <div class="auth-shell">
    <a class="brand auth-brand" href="../index.html">
      <span class="brand-mark">LF</span>
      LeadFinder
    </a>

    <section class="auth-card glass">
      <span class="eyebrow">ACESSO SEGURO</span>
      <h1>Bem-vindo de volta.</h1>
      <p>Entre para continuar sua prospecção.</p>

      <form id="login-form">
        <label>
          E-mail
          <input
            id="login-email"
            type="email"
            required
            autocomplete="email"
            placeholder="voce@gmail.com"
          >
        </label>

        <label>
          Senha
          <div class="password-wrap">
            <input
              id="login-password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Sua senha"
            >
            <button
              type="button"
              class="password-toggle"
              data-target="login-password"
            >Mostrar</button>
          </div>
        </label>

        <div class="form-row">
          <a href="#" id="forgot-password">Esqueci minha senha</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit">
          Entrar
        </button>

        <div id="login-message" class="form-message" role="status"></div>
      </form>

      <p class="auth-switch">
        Ainda não tem conta?
        <a href="cadastro.html">Criar conta</a>
      </p>
    </section>
  </div>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
